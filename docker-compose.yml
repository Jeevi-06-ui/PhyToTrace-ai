services:
  backend:
    build:
      context: .
    ports:
      - "127.0.0.1:8000:8080"
    environment:
      PHYTOTRACE_ENV: production
      PHYTOTRACE_DEVICE: cpu
      PHYTOTRACE_CORS_ORIGINS: http://localhost:3000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v1/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        PHYTOTRACE_API_ORIGIN: http://backend:8080
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
