# Baseline MobileNetV3-Small 3-Class Classifier Configuration
model:
  name: "mobilenet_v3_small"
  pretrained: true
  num_classes: 3
  classes:
    0: "healthy"
    1: "leaf_miner_damage"
    2: "other_damage"
  input_size: [224, 224]
  dropout: 0.2

training:
  seed: 42
  batch_size: 16
  num_workers: 2
  head_epochs: 5
  finetune_epochs: 25
  lr_head: 0.001
  lr_finetune: 0.0001
  weight_decay: 0.0001
  early_stopping_patience: 6
  gradient_clip_norm: 1.0
  device: "auto"  # 'mps', 'cpu', or 'auto'

augmentation:
  random_horizontal_flip: 0.5
  random_vertical_flip: 0.5
  random_rotation_degrees: 15
  color_jitter:
    brightness: 0.15
    contrast: 0.15
    saturation: 0.10
    hue: 0.05
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

checkpoints:
  save_dir: "models/checkpoints/baseline"
  best_model_name: "baseline_mobilenetv3_best.pt"

